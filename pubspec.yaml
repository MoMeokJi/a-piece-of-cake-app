name: cake
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
 flutter:
   sdk: flutter
 cupertino_icons: ^1.0.8
 json_annotation: ^4.9.0
 freezed_annotation: ^3.1.0
 provider: ^6.1.2
 go_router: ^16.0.0
 get_it: ^8.0.0
 flutter_svg: ^2.0.10+1
 intl: ^0.20.2
 http: ^1.2.2
 easy_stepper: ^0.8.5+1
 flutter_secure_storage: ^9.2.2
 fluttertoast: ^8.2.12
 flutter_spinkit: ^5.2.1
 carousel_slider: ^5.0.0
 shimmer: ^3.0.0
 url_launcher: ^6.3.1
 cached_network_image: ^3.4.1
 youtube_player_flutter: ^9.1.1
 package_info_plus: ^8.1.2
 image_picker: ^1.1.2
 permission_handler: ^12.0.1
 firebase_core: ^3.9.0
 firebase_messaging: ^15.1.6
 flutter_local_notifications: ^19.3.0
 flutter_native_splash: ^2.4.4
 sqflite: ^2.4.1
 rxdart: ^0.28.0
 shared_preferences: ^2.5.2
 pull_to_refresh: ^2.0.0
 flutter_dotenv: ^5.2.1

dev_dependencies:
 flutter_test:
   sdk: flutter
 flutter_lints: ^6.0.0
 build_runner: ^2.4.13
 freezed: ^3.1.0
 json_serializable: ^6.8.0
 mockito: ^5.4.4


flutter:
 uses-material-design: true
 assets:
   - assets/images/
   - assets/logo/
   - assets/icons/
   - .env
 fonts:
   - family: NanumSquareNeo
     fonts:
       - asset: assets/fonts/NanumSquareNeoOTF-Lt.otf
         weight: 300
       - asset: assets/fonts/NanumSquareNeoOTF-Rg.otf
         weight: 400
       - asset: assets/fonts/NanumSquareNeoOTF-Bd.otf
         weight: 700
       - asset: assets/fonts/NanumSquareNeoOTF-Eb.otf
         weight: 800
       - asset: assets/fonts/NanumSquareNeoOTF-Hv.otf
         weight: 900
   - family: NanumSquareRound
     fonts:
       - asset: assets/fonts/NanumSquareRoundOTFL.otf
         weight: 300
       - asset: assets/fonts/NanumSquareRoundOTFR.otf
         weight: 400
       - asset: assets/fonts/NanumSquareRoundOTFB.otf
         weight: 700
       - asset: assets/fonts/NanumSquareRoundOTFEB.otf
         weight: 800
   - family: DCC
     fonts:
       - asset: assets/fonts/DCC_Cloud.otf
         weight: 400
