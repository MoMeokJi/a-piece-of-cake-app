name: cake
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.1.0+7

environment:
  sdk: ^3.8.1

dependencies:
 flutter:
   sdk: flutter
 flutter_localizations:
   sdk: flutter 
 cupertino_icons: ^1.0.8
 json_annotation: ^4.9.0
 freezed_annotation: ^3.1.0
 provider: ^6.1.2
 go_router: ^16.0.0
 get_it: ^8.0.0
 intl: ^0.20.2
 flutter_secure_storage: ^9.2.2
 url_launcher: ^6.3.1
 cached_network_image: ^3.4.1
 image_picker: ^1.1.2
 permission_handler: ^12.0.1
 firebase_core: ^3.9.0
 firebase_messaging: ^15.1.6
 flutter_local_notifications: ^19.3.0
 flutter_native_splash: ^2.4.4
 sqflite: ^2.4.1
 shared_preferences: ^2.5.2
 flutter_svg: ^2.2.1
 photo_view: ^0.15.0
 youtube_player_iframe: ^5.2.2
 package_info_plus: ^9.0.0
 firebase_analytics: ^11.6.0
 firebase_crashlytics: ^4.3.10
 uuid: ^4.5.3
 dio: ^5.11.0
 google_sign_in: ^7.2.0
 sign_in_with_apple: ^8.2.0
 crypto: ^3.0.8

dev_dependencies:
 flutter_test:
   sdk: flutter
 flutter_lints: ^6.0.0
 build_runner: ^2.4.13
 freezed: ^3.1.0
 json_serializable: ^6.8.0
 flutter_launcher_icons: ^0.14.3

# 네이티브 스플래시 (Flutter가 뜨기 전 화면). 피그마 A-7과 같게: 온보딩 그라데이션 + 흰 세로 로고 150.
# 원본 PNG는 assets/splash/ (번들에는 안 들어감). `dart run flutter_native_splash:create`
flutter_native_splash:
  background_image: "assets/splash/background.png"
  image: "assets/splash/logo.png"
  # Android 12+는 시스템이 단색 배경 + 원형 마스크 아이콘만 허용한다. 앱 아이콘과 같은 파란 배경 + 케이크.
  android_12:
    color: "#8196C3"
    image: "assets/splash/android12_icon.png"

# 앱 아이콘. `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon_1024.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#8196C3"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground_1024.png"


flutter:
 uses-material-design: true
 assets:
   - assets/images/
   - assets/images/figma/
   - assets/icons/ui/
   - assets/icons/brand/
 fonts:
   - family: NanumSquareRound
     fonts:
       - asset: assets/fonts/NanumSquareRoundOTFB.otf
         weight: 700
   - family: Pretendard
     fonts:
       - asset: assets/fonts/Pretendard-Regular.ttf
         weight: 400
       - asset: assets/fonts/Pretendard-Medium.ttf
         weight: 500
       - asset: assets/fonts/Pretendard-SemiBold.ttf
         weight: 600
